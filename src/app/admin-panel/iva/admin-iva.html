<div class="config-grid">
    <div class="config-card shadow-lg">
        <div class="config-header">
            <div class="icon-box">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            </div>
            <h3>Impuesto al Valor Agregado (IVA)</h3>
        </div>
        <div class="config-body">
            <div class="current-value">
                <p>IVA Actual en Dilo:</p>
                <h2 *ngIf="isIvaLoaded">{{ ivaActual }} <span class="text-sm text-gray">({{ ivaActual * 100 }}%)</span></h2>
                <h2 *ngIf="!isIvaLoaded" class="text-gray">Cargando...</h2>
            </div>
            
            <div class="form-group mt-4">
                <label>Establecer nuevo IVA (Formato decimal)</label>
                <div class="input-wrapper">
                    <input type="number" step="0.01" [(ngModel)]="nuevoIva" placeholder="Ej: 0.15 para 15%" class="form-control">
                </div>
                <small class="text-gray mt-1 block">Este cambio afectará inmediatamente a todos los negocios.</small>
            </div>

            <button class="btn btn-primary mt-4 w-full" (click)="actualizarIva()" [disabled]="!nuevoIva">
                Actualizar IVA del Sistema
            </button>
        </div>
    </div>
</div>
