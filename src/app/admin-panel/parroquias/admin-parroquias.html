<div class="data-card wrapper-transparent">
    
    <!-- Barra de Herramientas -->
    <div class="modern-toolbar shadow-sm">
        <div class="search-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" placeholder="Buscar parroquia por nombre..." [(ngModel)]="busqueda" (input)="filtrarParroquias()">
        </div>
        
        <div class="toolbar-actions">
            <div class="results-badge hidden-mobile">
                <span class="pulse-dot" style="background-color: #8b5cf6; box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4);"></span>
                {{ parroquiasFiltradas.length }} parroquias
            </div>
            <!-- BOTÓN NUEVA PARROQUIA -->
            <button class="btn btn-primary btn-add" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9);" (click)="abrirModalCrear()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Nueva Parroquia
            </button>
        </div>
    </div>

    <!-- Spinner -->
    <div class="loading-state glass-panel shadow-sm" *ngIf="isLoading">
        <div class="spinner" style="border-left-color: #8b5cf6;"></div>
        <p>Cargando ubicaciones...</p>
    </div>

    <!-- CUADRÍCULA DE PARROQUIAS -->
    <div class="location-grid" *ngIf="!isLoading && parroquiasFiltradas.length > 0">
        <div class="location-card" *ngFor="let p of parroquiasFiltradas; let i = index" [style.animation-delay]="(i * 0.05) + 's'">
            <div class="location-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            </div>
            <div class="location-info">
                <h3>{{ p.nombre }}</h3>
                <p>ID Interno: #{{ p.id }}</p>
            </div>
            <div class="location-actions">
                <button class="btn-icon edit" (click)="abrirModalEditar(p)" title="Editar Parroquia">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </button>
                <button class="btn-icon delete" (click)="eliminarParroquia(p.id)" title="Eliminar Parroquia">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mensaje cuando no hay resultados -->
    <div class="empty-state glass-panel shadow-sm" *ngIf="!isLoading && parroquiasFiltradas.length === 0">
        <div class="empty-icon-wrapper" style="color: #a78bfa; background: #f5f3ff;">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
        </div>
        <h3 class="text-dark font-bold">No hay parroquias registradas</h3>
        <p class="text-gray">Comienza agregando ubicaciones para que los usuarios puedan seleccionarlas.</p>
    </div>
</div>

<!-- 🔥 MODAL CREAR / EDITAR PARROQUIA -->
<div class="modal-overlay" *ngIf="showModal">
    <div class="modal-container shadow-xl" style="max-width: 450px;">
        <div class="modal-header">
            <h3>{{ isEditing ? 'Editar Parroquia' : 'Nueva Parroquia' }}</h3>
            <button class="close-modal" (click)="showModal = false">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        
        <div class="modal-body form-grid">
            <div class="form-group full-width">
                <label>Nombre de la Parroquia <span class="text-red">*</span></label>
                <div class="input-with-icon" style="position: relative;">
                    <svg style="position: absolute; left: 14px; top: 12px; color: #94a3b8;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    <input type="text" class="form-control" style="padding-left: 40px;" [(ngModel)]="parroquiaActual.nombre" placeholder="Ej: Tarqui, Turi, Yanuncay...">
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-outline" (click)="showModal = false">Cancelar</button>
            <button class="btn btn-primary" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9);" (click)="guardarParroquia()">{{ isEditing ? 'Guardar Cambios' : 'Registrar Parroquia' }}</button>
        </div>
    </div>
</div>
